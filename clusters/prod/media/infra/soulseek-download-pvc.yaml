apiVersion: v1
kind: PersistentVolume
metadata:
  name: soulseek-download
spec:
  capacity:
    storage: "4Ti"
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    path: /nfs/soulseek
    server: 192.168.8.202

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: soulseek-download
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "4Ti"
  storageClassName: ""
  volumeName: soulseek-download
