apiVersion: v1
kind: PersistentVolume
metadata:
  name: videos
spec:
  capacity:
    storage: "5Ti"
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/hdd/shared/mediacenter/media/videos
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: videos
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: "5Ti"
  storageClassName: ""
  volumeName: videos
