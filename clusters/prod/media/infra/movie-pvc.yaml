apiVersion: v1
kind: PersistentVolume
metadata:
  name: movies
spec:
  capacity:
    storage: "5Ti"
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /mnt/hdd/shared/mediacenter/media/movies
    type: Directory

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: movies
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "5Ti"
  storageClassName: ""
  volumeName: movies
