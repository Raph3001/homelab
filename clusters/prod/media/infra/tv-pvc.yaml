apiVersion: v1
kind: PersistentVolume
metadata:
  name: tv
spec:
  capacity:
    storage: "16Ti"
  accessModes:
    - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  nfs:
    path: /mnt/main/tv
    server: 192.168.8.123

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tv
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: "16Ti"
  storageClassName: ""
  volumeName: tv
