apiVersion: v1
kind: Service
metadata:
  name: prowlarr
spec:
  selector:
    app: prowlarr
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: prowlarr-tailscale
spec:
  defaultBackend:
    service:
      name: prowlarr
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
      - prowlarr
