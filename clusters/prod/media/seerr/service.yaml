apiVersion: v1
kind: Service
metadata:
  name: seerr
spec:
  selector:
    app: seerr
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: seerr-tailscale
  annotations:
    tailscale.com/funnel: "true" 
spec:
  defaultBackend:
    service:
      name: seerr
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
        - seerr
