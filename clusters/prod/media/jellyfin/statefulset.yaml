apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  serviceName: jellyfin
  replicas: 1
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: jellyfin.hw
                    operator: In
                    values:
                      - amd
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: jellyfin.hw
                    operator: In
                    values:
                      - amd
                      - intel
      securityContext:
        supplementalGroups:
          - 105
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: tv
              mountPath: /tv
            - name: movies
              mountPath: /movies
            - name: videos
              mountPath: /videos
            - name: dri
              mountPath: /dev/dri
            - name: jellyfin-cache
              mountPath: /cache
            - name: lib-dri
              mountPath: /usr/lib/x86_64-linux-gnu/dri
              readOnly: true
      volumes:
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: videos
          persistentVolumeClaim:
            claimName: videos
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: lib-dri
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/dri
            type: Directory
        - name: jellyfin-cache
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: jellyfin-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
