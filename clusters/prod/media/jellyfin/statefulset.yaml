apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  serviceName: jellyfin
  replicas: 1
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      securityContext:
        fsGroup: 1000
        supplementalGroups:
          - 44 # for video
          - 105 # for rendering
      containers:
        - name: jellyfin
          image: jellyfin/jellyfin:latest
          env:
            - name: LIBVA_DRIVER_NAME
              value: iHD
            - name: LIBVA_DRIVERS_PATH
              value: /usr/lib/x86_64-linux-gnu/dri
            - name: TMPDIR
              value: /cache
            - name: FFREPORT
              value: file=/cache/ffmpeg-report.log:level=32
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: tv
              mountPath: /tv
            - name: movies
              mountPath: /movies
            - name: videos
              mountPath: /videos
            - name: dri
              mountPath: /dev/dri
            - name: jellyfin-cache
              mountPath: /cache
            - name: lib-dri
              mountPath: /usr/lib/x86_64-linux-gnu/dri
              readOnly: true
            - name: sys-drm
              mountPath: /sys/class/drm
              readOnly: true

      volumes:
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: videos
          persistentVolumeClaim:
            claimName: videos
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
        - name: lib-dri
          hostPath:
            path: /usr/lib/x86_64-linux-gnu/dri
            type: Directory
        - name: jellyfin-cache
          emptyDir: {}
        - name: sys-drm
          hostPath:
            path: /sys/class/drm
            type: Directory

  volumeClaimTemplates:
    - metadata:
        name: jellyfin-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
