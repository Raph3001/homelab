apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: jellyfin
spec:
  selector:
    matchLabels:
      app: jellyfin
  serviceName: jellyfin
  replicas: 1
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: perf
                    operator: In
                    values: ["high"]

            - weight: 50
              preference:
                matchExpressions:
                  - key: perf
                    operator: In
                    values: ["medium"]

            - weight: 10
              preference:
                matchExpressions:
                  - key: perf
                    operator: In
                    values: ["low"]


      securityContext:
        supplementalGroups:
          - 105
          - 992
          - 44
      containers:
        - name: jellyfin
          image: linuxserver/jellyfin:latest
          resources:
            requests:
              cpu: "1000m"
              memory: "4Gi"
          env:
            - name: DOCKER_MODS
              value: "linuxserver/mods:jellyfin-opencl-amd"
            - name: PUID
              value: "0"
            - name: PGID
              value: "0"
            - name: RENDER_GROUP_ID
              value: "992" 
            - name: LIBVA_DRIVER_NAME
              value: "radeonsi"
          ports:
            - name: http
              containerPort: 8096
          securityContext:
            privileged: true
            runAsUser: 0
            runAsGroup: 0
          volumeMounts:
            - name: jellyfin-config
              mountPath: /config
            - name: tv
              mountPath: /tv
            - name: movies
              mountPath: /movies
            - name: videos
              mountPath: /videos
            - name: jellyfin-cache
              mountPath: /cache
            - name: dri
              mountPath: /dev/dri
            - mountPath: /dev/shm
              name: shm
      volumes:
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: videos
          persistentVolumeClaim:
            claimName: videos
        - name: dri
          hostPath:
            path: /dev/dri
        - name: jellyfin-cache
          emptyDir: {}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: jellyfin-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 25Gi
