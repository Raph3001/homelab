apiVersion: v1
kind: Service
metadata:
  name: radarr
spec:
  selector:
    app: radarr
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: radarr-tailscale
spec:
  defaultBackend:
    service:
      name: radarr
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
      - radarr
