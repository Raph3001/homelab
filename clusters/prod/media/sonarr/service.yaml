apiVersion: v1
kind: Service
metadata:
  name: sonarr
spec:
  selector:
    app: sonarr
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-tailscale
spec:
  defaultBackend:
    service:
      name: sonarr
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
      - sonarr
