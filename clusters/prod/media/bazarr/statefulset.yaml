apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bazarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: bazarr
  template:
    metadata:
      labels:
        app: bazarr
    spec:
      containers:
        - name: bazarr
          image: lscr.io/linuxserver/bazarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
            - name: TZ
              value: Europe/Vienna
          ports:
            - name: http
              containerPort: 6767
          volumeMounts:
            - name: bazarr-config
              mountPath: /config
            - name: movies
              mountPath: /movies
            - name: tv
              mountPath: /tv
            - name: serien
              mountPath: /serien
      volumes:
        - name: tv
          persistentVolumeClaim:
            claimName: tv
        - name: movies
          persistentVolumeClaim:
            claimName: movies
        - name: serien
          persistentVolumeClaim:
            claimName: serien
  volumeClaimTemplates:
    - metadata:
        name: bazarr-config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi
