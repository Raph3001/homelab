apiVersion: v1
kind: Service
metadata:
  name: navidrome
spec:
  selector:
    app: navidrome
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: navidrome-tailscale
  annotations:
    tailscale.com/funnel: "true"
spec:
  defaultBackend:
    service:
      name: navidrome
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
      - navidrome
