apiVersion: v1
kind: Service
metadata:
  name: nzbget
spec:
  selector:
    app: nzbget
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nzbget-tailscale
spec:
  defaultBackend:
    service:
      name: nzbget
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
        - nzbget
