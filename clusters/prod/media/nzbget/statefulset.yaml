apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nzbget
spec:
  selector:
    matchLabels:
      app: nzbget
  serviceName: nzbget
  replicas: 1
  template:
    metadata:
      labels:
        app: nzbget
    spec:
      nodeSelector:
        downloads: "true"
      containers:
        - name: nzbget
          image: lscr.io/linuxserver/nzbget:latest
          ports:
            - name: http
              containerPort: 6789
          envFrom:
            - secretRef:
                name: nzbget
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: incomplete
              mountPath: /incomplete
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: nzbget-config
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
        - name: incomplete
          persistentVolumeClaim:
            claimName: incomplete
