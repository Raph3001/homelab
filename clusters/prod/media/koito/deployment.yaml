apiVersion: apps/v1
kind: Deployment
metadata:
  name: koito
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: koito
  template:
    metadata:
      labels:
        app: koito
    spec:
      containers:
        - name: koito
          image: gabehf/koito:latest
          env:
            - name: KOITO_SUBSONIC_URL
              value: https://navidrome.raphael-bader.com
          envFrom:
            - secretRef:
                name: koito
          ports:
            - name: http
              containerPort: 4110
          volumeMounts:
            - name: koito-data
              mountPath: /etc/koito
      volumes:
        - name: koito-data
          persistentVolumeClaim:
            claimName: koito-pvc
