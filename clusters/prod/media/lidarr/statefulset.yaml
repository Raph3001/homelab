apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: lidarr
spec:
  selector:
    matchLabels:
      app: lidarr
  serviceName: lidarr
  replicas: 1
  template:
    metadata:
      labels:
        app: lidarr
    spec:
      nodeSelector:
        downloads: "true"
      securityContext:
        fsGroup: 1000  
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: lidarr
          image: lscr.io/linuxserver/lidarr:latest
          ports:
            - name: http
              containerPort: 8686
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: music
              mountPath: /music
      volumes:
        - name: music
          persistentVolumeClaim:
            claimName: music
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
