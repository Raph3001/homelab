apiVersion: v1
kind: Service
metadata:
  name: lidarr
spec:
  selector:
    app: lidarr
  ports:
    - name: http
      port: 80
      targetPort: http

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lidarr-tailscale
spec:
  defaultBackend:
    service:
      name: lidarr
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
      - lidarr
