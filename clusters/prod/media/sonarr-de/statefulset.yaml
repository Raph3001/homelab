apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sonarr-de
spec:
  selector:
    matchLabels:
      app: sonarr-de
  serviceName: sonarr-de
  replicas: 1
  template:
    metadata:
      labels:
        app: sonarr-de
    spec:
      nodeSelector:
        downloads: "true"
      securityContext:
        fsGroup: 1000
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: sonarr
          image: lscr.io/linuxserver/sonarr:latest
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "1000"
          ports:
            - name: http
              containerPort: 8989
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
            - name: serien
              mountPath: /serien
      volumes:
        - name: downloads
          persistentVolumeClaim:
            claimName: downloads
        - name: serien
          persistentVolumeClaim:
            claimName: serien        # needs a separate PVC
  volumeClaimTemplates:
    - metadata:
        name: config
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
