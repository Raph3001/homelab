apiVersion: v1
kind: Service
metadata:
  name: sonarr-de
spec:
  selector:
    app: sonarr-de
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sonarr-de-tailscale
spec:
  defaultBackend:
    service:
      name: sonarr-de
      port:
        name: http
  ingressClassName: tailscale
  tls:
    - hosts:
        - sonarr-de
