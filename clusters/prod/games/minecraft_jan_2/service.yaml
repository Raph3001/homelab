apiVersion: v1
kind: Service
metadata:
  name: minecraft-jan-2
  annotations:
    tailscale.com/expose: "true"
    tailscale.com/hostname: "minecraft-jan-2"
    tailscale.com/funnel: "true"
spec:
  selector:
    app: minecraft-jan-2
  type: LoadBalancer
  loadBalancerClass: tailscale
  ports:
    - name: minecraft
      port: 25565
      targetPort: 25565
      protocol: TCP
