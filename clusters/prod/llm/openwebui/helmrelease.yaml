apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: openwebui
spec:
  interval: 5m
  timeout: 10m0s
  chart:
    spec:
      chart: open-webui
      version: ""
      sourceRef:
        kind: HelmRepository
        name: openwebui-repo
        namespace: infra
  values:
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
