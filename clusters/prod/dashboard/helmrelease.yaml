apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
spec:
  interval: 5m
  timeout: 10m0s
  chart:
    spec:
      chart: kube-prometheus-stack
      version: ""
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: infra
  values:
    grafana:
      envFrom:
        - secretRef:
          name: dashboard
      persistence:
        enabled: true
        size: 5Gi
    prometheus:
      prometheusSpec:
        retention: 15d
        storageSpec:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 10Gi
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelectorNilUsesHelmValues: false
    alertmanager:
      alertmanagerSpec:
        storage:
          volumeClaimTemplate:
            spec:
              resources:
                requests:
                  storage: 2Gi
    nodeExporter:
      enabled: true
    kubeStateMetrics:
      enabled: true
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
