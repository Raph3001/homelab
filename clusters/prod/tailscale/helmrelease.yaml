apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-release
spec:
  interval: 5m
  timeout: 10m0s
  chart:
    spec:
      chart: tailscale-operator
      version: "1.90.9" #TODO: configure auto updates
      sourceRef:
        kind: HelmRepository
        name: tailscale-repo
        namespace: infra
  values:
    apiServerProxyConfig:
      mode: "true"
  valuesFrom:
    - kind: Secret
      name: operator-oauth
      valuesKey: client_id
      targetPath: oauth.clientId
    - kind: Secret
      name: operator-oauth
      valuesKey: client_secret
      targetPath: oauth.clientSecret
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
