apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudflare-tunnel
      version: "0.3.2"
      sourceRef:
        kind: HelmRepository
        name: cloudflare-repo
        namespace: infra
  values:
    replicaCount: 0
            
  valuesFrom:
    - kind: Secret
      name: cloudflare-tunnel
      valuesKey: token
      targetPath: cloudflare.tunnelToken

