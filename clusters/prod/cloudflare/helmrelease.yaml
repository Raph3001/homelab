apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cloudflare-tunnel
  namespace: cloudflare
spec:
  interval: 5m
  chart:
    spec:
      chart: cloudflare-tunnel
      version: "0.3.2"
      sourceRef:
        kind: HelmRepository
        name: cloudflare-repo
        namespace: infra
  values:
    command:
      - cloudflared
      - tunnel
      - "--no-autoupdate"
      - run
      - --token
      - "$(TUNNEL_TOKEN)"

    configFile: null
    volumes: []
    volumeMounts: []

    env:
      - name: TUNNEL_TOKEN
        valueFrom:
          secretKeyRef:
            name: cloudflare-tunnel
            key: token