apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: matrix-synapse
  namespace: element
spec:
  interval: 15m
  chart:
    spec:
      chart: matrix-synapse
      version: "3.12.18" # (versions found here) https://artifacthub.io/packages/helm/ananace-charts/matrix-synapse
      sourceRef:
        kind: HelmRepository
        name: ananace
        namespace: infra
  values:
    serverName: "matrix.taild304c8.ts.net"
    publicServerName: "matrix.taild304c8.ts.net"

    config:
      enableRegistration: false
    
    postgresql:
      enabled: true
      persistence:
        size: 75Gi

  valuesFrom:
    - kind: Secret
      name: matrix-synapse-secrets
      valuesKey: registration-shared-secret
      targetPath: config.registrationSharedSecret
