apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn-release
spec:
  interval: 5m
  timeout: 10m0s
  chart:
    spec:
      chart: longhorn
      version: "1.10.0"
      sourceRef:
        kind: HelmRepository
        name: longhorn-repo
        namespace: infra
  values:
    persistence:
      defaultClassReplicaCount: 2
    defaultSettings:
      disableSchedulingOnMaster: false
  upgrade:
    remediation:
      remediateLastFailure: true
      retries: 3
    